<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Online Store</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #f4f4f9; color: #333; }
    header { background-color: #222; color: #fff; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 24px; }
    nav a { color: #fff; text-decoration: none; margin-left: 20px; font-size: 16px; }
    .cart-badge { background-color: #ff6b6b; padding: 4px 10px; border-radius: 12px; font-weight: bold; }
    .hero { background-color: #007bff; color: white; text-align: center; padding: 50px 20px; }
    .hero h2 { font-size: 32px; margin-bottom: 10px; }
    .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
    .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
    .product-card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .product-card img { width: 100%; height: 180px; object-fit: cover; border-radius: 4px; margin-bottom: 15px; }
    .product-card h3 { font-size: 18px; margin-bottom: 8px; }
    .price { color: #28a745; font-size: 18px; font-weight: bold; margin-bottom: 15px; }
    .btn { background-color: #222; color: #fff; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 15px; }
    .btn:hover { background-color: #444; }
    footer { background-color: #222; color: #ccc; text-align: center; padding: 20px; margin-top: 40px; }
  </style>
</head>
<body>
  <header>
    <h1>ShopEase</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#products">Products</a>
      <a href="#">Cart <span id="cart-count" class="cart-badge">0</span></a>
    </nav>
  </header>
  <section class="hero">
    <h2>Welcome to ShopEase</h2>
    <p>Quality products at everyday low prices.</p>
  </section>
  <main class="container" id="products">
    <div class="product-grid">
      <div class="product-card">
        <img src="https://placehold.co" alt="Wireless Headphones">
        <h3>Wireless Headphones</h3>
        <p class="price">$49.99</p>
        <button class="btn" onclick="addToCart('Wireless Headphones')">Add to Cart</button>
      </div>
      <div class="product-card">
        <img src="https://placehold.co" alt="Smart Watch">
        <h3>Smart Watch</h3>
        <p class="price">$89.99</p>
        <button class="btn" onclick="addToCart('Smart Watch')">Add to Cart</button>
      </div>
      <div class="product-card">
        <img src="https://placehold.co" alt="Running Shoes">
        <h3>Running Shoes</h3>
        <p class="price">$64.99</p>
        <button class="btn" onclick="addToCart('Running Shoes')">Add to Cart</button>
      </div>
      <div class="product-card">
        <img src="https://placehold.co" alt="Leather Backpack">
        <h3>Leather Backpack</h3>
        <p class="price">$54.99</p>
        <button class="btn" onclick="addToCart('Leather Backpack')">Add to Cart</button>
      </div>
    </div>
  </main>
  <footer>
    <p>&copy; 2026 ShopEase. All rights reserved.</p>
  </footer>
  <script>
    let count = 0;
    function addToCart(productName) {
      count++;
      document.getElementById('cart-count').innerText = count;
      alert(productName + ' has been added to your cart!');
    }
  </script>
</body>
</html>
